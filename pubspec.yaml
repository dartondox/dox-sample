name: dox_sample
publish_to: 'none'

environment:
  sdk: ^3.14.0

dependencies:
  dox_core: ^3.1.1
  dox_orm: ^3.1.0
  dox_migration: ^3.1.0
  dox_queue: ^3.1.0
  dox_queue_database: ^3.1.0
  dox_scheduler: ^3.1.0
  dox_storage: ^3.1.0
  # dox_core already uses these three. They are listed here so that
  # `dart run skills@ get` installs their skills too.
  dox_cache: ^3.1.3
  dox_validation: ^3.1.2
  dox_openapi: ^3.1.0

dev_dependencies:
  dox_builder: ^3.1.1
  build_runner: ^2.4.13
  lints: ^6.1.0
  test: ^1.26.3

# The app uses SQLite, so the build skips the Postgres and MySQL drivers.
# When you set DB_CONNECTION=postgres or mysql in .env, remove the two
# lines of that driver (its name line and its `skip: true` line).
# Then you may add `sqlite3: source: system` under
# `user_defines`: the build then loads the SQLite of the system and does
# not download its own copy.
hooks:
  user_defines:
    dox_postgres_native:
      skip: true
    dox_mysql_native:
      skip: true
